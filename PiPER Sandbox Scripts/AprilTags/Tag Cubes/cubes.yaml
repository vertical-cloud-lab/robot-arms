# ============================================================================================
# AprilTag cubes for the PiPER cell: one entry per printed part. Units: mm.
#
# Every cube is printed in two colours: a white body (cube + mount) with the tag's black
# cells sunk into its faces. The white body is the tag's quiet zone, so the border the
# detector needs is built in (PR #77: a tag on the black bed with no white margin never
# decoded).
#
#   tag        edge of the black square. The cube's edge is tag + 2 x (one cell + margin), a
#              cell being tag / 8 for tag36h11: 40 -> 51.6 mm cube, 28 -> 36.6, 24 -> 31.6.
#   first_id   tag36h11 IDs run first_id + 0..4 on the top, front, right, back and left faces
#              (front = -y of the cube), so an ID alone says which cube and which face. A face
#              with no tag (the mount side) keeps its ID unused. 100-169 are free: the flat
#              tags in Digital Twin/config/*.yaml use 0-98.
#   mount      table_edge | base_collar | shelf_corner | adhesive (tag_cubes.py, MOUNTS).
#              The rest of an entry is that mount's settings.
#   place      where the part goes in the cell, relative to the Digital Twin's objects
#              (Digital Twin/config/cell_layout.yaml): cell_view.py puts it there and looks at
#              it through mpzy's camera. Printing doesn't use it.
#                edge: back|front|left|right, along: mm along that edge (world x for back and
#                front, world y for left and right) | arm | corner: front_left|front_right|
#                back_left|back_right (of the shelf's plate) | printer: [x, y, z] on the A1
#                mini, printer frame | printer_front: {x: , z: } (tag centre on the base's
#                front face, printer frame)
#
# THE MOUNTS' DIMENSIONS ARE ESTIMATES (the Digital Twin's cell_layout.yaml, AgileX's base
# mesh). Measure the table's edge, the shelf plate's thickness and the arm's base flange,
# edit them here and run make_cubes.py again before printing.
# ============================================================================================

family: tag36h11

style:
  margin: 0.8        # white beyond the one-cell quiet zone (covers the chamfer)
  chamfer: 0.6       # on every edge of the cube
  inlay: 1.0         # depth of the black cells (black PLA hides white at 0.4 mm; 1 mm is safe)
  border_cells: 1.0  # quiet zone, in cells. 1 is the minimum; the cube's edge grows 2 cells per +1

parts:
  # --- W1-W4: the table, centre of each edge (the cell's world frame, and a camera-bump check).
  #     The flange takes two wood screws into the plywood; the lip hangs over the table's edge.
  #     Print lying on its back (the lip side): make_cubes.py turns it that way.
  #     W1 sits right of the rest stand: the back edge's centre is under it.
  - {name: W1, mount: table_edge, tag: 40, first_id: 100, lip_depth: 12, place: {edge: back, along: 330}}
  - {name: W2, mount: table_edge, tag: 40, first_id: 105, lip_depth: 12, place: {edge: right, along: 0}}
  - {name: W3, mount: table_edge, tag: 40, first_id: 110, lip_depth: 12, place: {edge: left, along: 0}}
  - {name: W4, mount: table_edge, tag: 40, first_id: 115, lip_depth: 12, place: {edge: front, along: 0}}

  # --- A1-A3: one collar around the PiPER's base, a cube in front and on each side. Its
  #     opening is the base's bottom flange (AgileX's mesh: x -55..40, y -40..40 in the arm's
  #     base frame) + clearance, so the tags' corners are known in the arm's own frame.
  #     The face toward the base has no tag.
  - name: A_collar
    mount: base_collar
    tag: 28
    flange_x: [-55, 40]
    flange_y: [-40, 40]
    clearance: 0.4
    place: arm
    cubes:
      - {name: A1, first_id: 120, side: front}
      - {name: A2, first_id: 125, side: right}
      - {name: A3, first_id: 130, side: left}

  # --- S1-S4: the black perforated shelf's corners. A notch in the cube's bottom takes the
  #     plate's corner, so the cube caps it and needs no screws. One design, turned per corner
  #     (front-left 0, front-right 90, back-left -90, back-right 180 degrees).
  #     Printed upside down (the top tag face on the bed).
  - {name: S1, mount: shelf_corner, tag: 24, first_id: 140, plate_thickness: 5.0, place: {corner: front_left}}
  - {name: S2, mount: shelf_corner, tag: 24, first_id: 145, plate_thickness: 5.0, place: {corner: front_right}}
  - {name: S3, mount: shelf_corner, tag: 24, first_id: 150, plate_thickness: 5.0, place: {corner: back_left}}
  - {name: S4, mount: shelf_corner, tag: 24, first_id: 155, plate_thickness: 5.0, place: {corner: back_right}}

  # --- P1-P2: the A1 mini's housing. There's no CAD for it, so these are plain cubes for VHB
  #     tape, both on the base's top to the right of the plate, 80 mm apart. (The earlier
  #     plan's P2 on the base's front face is hidden behind the shelf from mpzy: cell_view.py.)
  #     Keep them clear of the screen and of the toolhead's path.
  - {name: P1, mount: adhesive, tag: 24, first_id: 160, mount_face: bottom, place: {printer: [115, -35, 54]}}
  - {name: P2, mount: adhesive, tag: 24, first_id: 165, mount_face: bottom, place: {printer: [115, -115, 54]}}
